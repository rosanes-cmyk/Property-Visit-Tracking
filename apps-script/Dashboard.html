<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Visit Logger</title>
<style>
/* Professional dark theme — Linear/Vercel-grade. Flat surfaces, one calm accent, no glow. */
:root{
  --bg:#0a0a0b; --surface:#111113; --surface-2:#18181b; --border:#26262b; --border-2:#35353c;
  --ink:#ededf0; --muted:#a1a1aa; --faint:#81818c;
  /* Measured, not eyeballed. On --surface: muted 7.36:1, faint 4.90:1; both clear AA (4.5:1),
     and they stay 1.6x apart so the hierarchy survives. The previous faint was 2.85:1 and it
     carried real content - the sub-label under every KPI, "no rows", empty fields in the detail
     panel. Unreadable on a phone outside a property, which is where this board is used. */
  --brand:#3b82f6; --brand-2:#60a5fa; --brand-soft:#0f1b30; --on-brand:#ffffff;
  --crit-ink:#fca5a5;
  --good:#22c55e; --good-bg:#0a2016; --warn:#f59e0b; --warn-bg:#2a1f08; --crit:#ef4444; --crit-bg:#2a0f12;
  --r:10px; --r-sm:8px; --r-xs:6px;
  /* Set from the real rendered heights by the observer at the end of this file. The fallbacks
     are only what the page uses for its first frame. */
  --h-appbar:45px; --h-subbar:48px;
  --sh:0 1px 2px rgba(0,0,0,.4);
  --sh-lift:0 8px 24px rgba(0,0,0,.5);
  --glow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
::selection{background:rgba(59,130,246,.30)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px;border:2px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:var(--faint)}

/* ---------- Live indicator ---------- */
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--good);
  background:var(--good-bg);border:1px solid rgba(34,197,94,.20);padding:3px 9px;border-radius:6px}
.live .dot{width:6px;height:6px;border-radius:50%;background:var(--good)}
@media (prefers-reduced-motion:no-preference){.live .dot{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.num{font-variant-numeric:tabular-nums}

/* ---------- App bar ---------- */
.appbar{background:var(--surface);color:var(--ink);padding:10px 22px;display:flex;
  justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border)}
/* Wraps rather than crushing the product name against the status text on a narrow window.
   The bar is measured, not assumed to be 45px, so growing a line costs nothing below it. */
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .logo{font-size:18px;width:32px;height:32px;display:grid;place-items:center;
  background:var(--brand);border-radius:8px;box-shadow:none}
.brand h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.1px}
.brand .env{font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  color:var(--brand-2);background:var(--brand-soft);border:1px solid var(--border);
  padding:3px 8px;border-radius:5px}
.appbar .right{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted)}
.appbar button{background:var(--surface-2);color:var(--ink);border:1px solid var(--border-2);
  border-radius:6px;padding:6px 11px;cursor:pointer;font:inherit;font-weight:600;font-size:12.5px}
.appbar button:hover{border-color:var(--faint)}

/* ---------- Sub bar (tabs) ---------- */
.subbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;
  top:var(--h-appbar);z-index:19}
.subbar .inner{max-width:1360px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:3px}
.seg button{border:none;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:12.5px;
  padding:6px 15px;border-radius:6px;cursor:pointer;transition:background .12s,color .12s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--brand);color:var(--on-brand);box-shadow:none}

/* ---------- Ribbon (alert chips) ---------- */
.ribbon{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.rchip{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;padding:5px 11px;cursor:pointer;transition:border-color .12s,background .12s}
.rchip:hover{border-color:var(--faint);background:var(--surface)}
.rchip .rv{font-size:16px;font-weight:700;line-height:1}
.rchip .rl{font-size:10.5px;color:var(--muted);line-height:1.1;font-weight:500}
.rchip.crit .rv{color:var(--crit)}
.rchip.warn .rv{color:var(--warn)}
.rchip.brand .rv{color:var(--brand-2)}

/* ---------- Filter bar ---------- */
/* Stacked, and the offsets are MEASURED. They were pinned at 45px and 93px, which assumed three
   bars that never change height - but the tab row and the alert ribbon both wrap, and on a phone
   the ribbon goes full width and drops to its own line. Below about 640px the subbar is taller
   than 45px, so the filter bar landed on top of the tabs. It looked broken on exactly the device
   somebody uses standing at a property. */
.filters{background:var(--surface-2);border-bottom:1px solid var(--border);position:sticky;
  top:calc(var(--h-appbar) + var(--h-subbar));z-index:18}
.filters .inner{max-width:1360px;margin:0 auto;padding:8px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--border-2);background:var(--surface);color:var(--muted);border-radius:6px;
  padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;transition:all .12s}
.chip:hover{color:var(--ink);border-color:var(--faint)}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand);box-shadow:none}

select,input,textarea{padding:7px 10px;border:1px solid var(--border-2);border-radius:6px;font:inherit;
  font-size:13px;background:var(--surface);color:var(--ink)}
select:focus,input:focus,textarea:focus{border-color:var(--brand);outline:none}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:1px}

.wrap{max-width:1360px;margin:0 auto;padding:16px 20px 96px}

/* ---------- Section headers ---------- */
.sec{display:flex;align-items:center;gap:10px;margin:24px 0 10px}
.sec h2{margin:0;font-size:12px;font-weight:650;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.sec .n{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);border-radius:5px;
  padding:1px 8px;font-size:11px;font-weight:600}
.sec .rule{flex:1;height:1px;background:var(--border)}

/* ---------- Cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border-2);
  border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh);
  transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--sh-lift);transform:translateY(-1px);border-color:var(--border-2)}
.card.crit{border-left-color:var(--crit)}
.card.warn{border-left-color:var(--warn)}
.card.good{border-left-color:var(--good)}
/*
 * THE CARD HEADER, and the reason it is this specific set of rules.
 *
 * It read "F u l t o n ,  J o e" down the left edge of the card - one character per line - and the cause
 * was overflow-wrap:anywhere on the name, added to stop long addresses widening a card.
 *
 * `anywhere` and `break-word` wrap identically. They differ in one place that is easy to miss: `anywhere`
 * also counts those break points when the browser works out the element's MIN-CONTENT width, so the name
 * block's minimum became one character. The two status chips beside it are white-space:nowrap and so have
 * a min-content width of their whole text - "Visit Completed - Needs Review" is most of the card. Flex
 * gave the chips what they demanded and squeezed the name into the character it had said it could live in.
 *
 * `break-word` wraps long text without offering to shrink below a real word, which is what was wanted.
 *
 * The rest of the rule set is what makes a narrow card behave: the name block may grow and shrink but
 * never below its own content (min-width:0 is what lets it shrink INSIDE a flex row at all), and the row
 * wraps, so on a phone the chips drop to their own line instead of eating the name.
 */
.card .top{display:flex;justify-content:flex-start;gap:8px 10px;align-items:flex-start;flex-wrap:wrap}
.card .top>div{flex:1 1 170px;min-width:0}
.card .seller{font-weight:650;font-size:14.5px;letter-spacing:-.1px}
.card .addr{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:break-word}
/* "2765 77th Ave, Oakland, CA, 94605, UNITED STATES" has few break opportunities a browser
   likes, and one card widening drags its whole grid row with it. */
.card .seller{overflow-wrap:break-word}

.chipflag{font-size:10.5px;font-weight:700;border-radius:5px;padding:3px 8px;white-space:nowrap;
  margin-left:0;background:var(--crit-bg);border:1px solid rgba(239,68,68,.35);color:var(--crit-ink);
  height:fit-content;letter-spacing:.03em;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chipstage{font-size:10.5px;font-weight:600;border-radius:5px;padding:3px 9px;white-space:nowrap;
  background:var(--surface-2);border:1px solid var(--border-2);color:var(--muted);height:fit-content;
  flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}

.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:11px;font-size:12.5px;color:var(--muted);align-items:center}
.meta b{color:var(--ink);font-weight:600}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:5px;padding:2px 8px}
.badge.crit{background:var(--crit-bg);color:var(--crit)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.good{background:var(--good-bg);color:var(--good)}

.na{font-size:12.5px;margin-top:11px;padding:8px 10px;background:var(--surface-2);border-radius:6px;
  display:flex;gap:7px;border:1px solid var(--border)}
.na .arrow{color:var(--brand-2);font-weight:700}

.result{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:6px}
.result span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.flag{font-size:12px;color:var(--crit);background:var(--crit-bg);border-radius:6px;padding:6px 9px;margin-top:9px}

.acts{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn2{font-size:12px;border:1px solid var(--border-2);color:var(--ink);background:var(--surface);
  border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:500;transition:all .12s}
.btn2:hover{border-color:var(--faint);background:var(--surface-2)}
.btn2.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:600}
.btn2.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}

a.rei{margin-left:auto;font-size:12px;color:var(--brand-2);text-decoration:none;font-weight:600}
a.rei:hover{color:var(--brand)}

.empty{color:var(--faint);font-size:12.5px;padding:14px;text-align:center;background:var(--surface);
  border:1px dashed var(--border-2);border-radius:var(--r)}

/* ---------- Pagination ---------- */
.pager{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:12px 2px 4px}
.pinfo{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbtns{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pbtn{min-width:30px;height:30px;padding:0 9px;border:1px solid var(--border);background:var(--surface);
  color:var(--ink);border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.pbtn.dot{padding:0}
.pbtn:hover:not(:disabled):not(.on){border-color:var(--faint);background:var(--surface-2)}
.pbtn.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.pbtn:disabled{opacity:.35;cursor:default}
.pgap{color:var(--faint);padding:0 2px;font-size:12.5px}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 17px;
  box-shadow:var(--sh);position:relative;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.kpi:hover{border-color:var(--border-2);box-shadow:var(--sh-lift)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.kpi.crit::before{background:var(--crit)}
.kpi.warn::before{background:var(--warn)}
.kpi.good::before{background:var(--good)}
.kpi .k-ico{font-size:15px;opacity:.85}
.kpi .k-v{font-size:32px;font-weight:750;letter-spacing:-1px;line-height:1.05;margin-top:6px;color:var(--ink)}
.kpi .k-l{font-size:12.5px;color:var(--ink);font-weight:600;margin-top:6px}
.kpi .k-s{font-size:11px;color:var(--faint);margin-top:2px}

/* ---------- Panels (bar charts) ---------- */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 18px 10px;box-shadow:var(--sh)}
.panel h3{margin:0 0 16px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:650}
.brow{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:12px;margin-bottom:11px;font-size:12.5px}
.brow .lab{color:var(--ink);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{background:var(--surface-2);border-radius:4px;height:14px;overflow:hidden;border:1px solid var(--border)}
.fill{height:100%;background:var(--brand);border-radius:4px;min-width:3px}
.brow .val{text-align:right;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- Data table ---------- */
.datahead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh)}
.tablewrap.scroll{max-height:calc(100vh - 230px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border-2) transparent}
.tablewrap.scroll::-webkit-scrollbar{width:10px}
.tablewrap.scroll::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px;border:2px solid var(--surface)}
.tablewrap.scroll::-webkit-scrollbar-thumb:hover{background:var(--faint)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;table-layout:fixed}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top;overflow:hidden;text-overflow:ellipsis}
th{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
  cursor:pointer;position:sticky;top:0;font-weight:650;white-space:nowrap;z-index:1}
th:hover{color:var(--ink)}
tbody tr:hover{background:var(--surface-2)}
td{white-space:normal;word-break:break-word}
td.addr{color:var(--muted)}
tbody tr[data-detail]{cursor:pointer}

.slink{color:inherit;text-decoration:none;border-bottom:1px solid rgba(96,165,250,.40)}
.slink:hover{color:var(--brand-2);border-bottom-color:var(--brand-2)}
.slink .ext{font-size:.82em;color:var(--brand-2);opacity:.8}

col.c-id{width:8%} col.c-seller{width:15%} col.c-address{width:24%} col.c-phone{width:12%}
col.c-lead{width:15%} col.c-stage{width:14%} col.c-owner{width:8%} col.c-due{width:9%}
col.c-overdue{width:8%} col.c-dq{width:8%}

.dnote{font-size:12px;color:var(--muted);flex:1}
.card .top{cursor:pointer;border-radius:6px;margin:-4px;padding:4px;transition:background .12s}
.card .top:hover{background:var(--surface-2)}

.dq{font-size:11px;font-weight:600;border-radius:5px;padding:2px 9px}
.dq.OK{background:var(--good-bg);color:var(--good)}
.dq.Incomplete{background:var(--warn-bg);color:var(--warn)}
.dq.Exception{background:var(--crit-bg);color:var(--crit)}

/* ---------- FAB ---------- */
/* bottom = 22px + the phone's home-indicator inset, so the button is not half under it. */
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--on-brand);border:none;
  border-radius:10px;padding:13px 20px;font-size:13.5px;font-weight:600;cursor:pointer;
  box-shadow:var(--sh-lift);z-index:15;transition:background .12s,transform .12s}
.fab:hover:not([disabled]){background:var(--brand-2);transform:translateY(-1px)}
.fab[disabled]{background:var(--surface-2);color:var(--muted);box-shadow:none;cursor:default}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;
  width:100%;max-width:480px;max-height:90dvh;overflow:auto;box-shadow:var(--sh-lift)}
/* dvh, not vh: with a mobile keyboard open, 90vh is taller than the screen and the Save button
   sits below the fold of a box that cannot be scrolled to the end. */
.modal h3{margin:0 0 4px;font-size:16px;font-weight:650}
.modal .cap{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.row2{display:flex;gap:11px}
.row2>*{flex:1}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}

.modal.detail{max-width:760px;padding:0}
.detail .dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;
  padding:20px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;
  background:var(--surface);z-index:1;border-radius:12px 12px 0 0}
.detail .d-seller{font-size:17px;font-weight:650;overflow-wrap:break-word}
.detail .d-addr{color:var(--muted);font-size:12.5px;margin-top:2px;overflow-wrap:break-word}
.detail .dbody{padding:8px 24px 4px}
.dl-grp{margin:16px 0}
.dl-grp h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--brand-2);font-weight:650}
.dl-grp dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:8px;overflow:hidden}
.dl-row{background:var(--surface);display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 12px;font-size:12.5px}
.dl-row dt{color:var(--muted);font-weight:600}
.dl-row dd{margin:0;color:var(--ink);word-break:break-word}
.dl-row.empty dd{color:var(--faint)}
.dl-row.edit{align-items:center}
.dl-row.edit dd input,.dl-row.edit dd select{width:100%;padding:6px 8px;font-size:12.5px}
.btn.danger{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.btn.danger:hover{background:rgba(239,68,68,.20)}
.detail .foot{display:flex;align-items:center;gap:10px;padding:14px 24px;border-top:1px solid var(--border);
  position:sticky;bottom:0;background:var(--surface);border-radius:0 0 12px 12px}

@media(max-width:620px){.dl-grp dl{grid-template-columns:1fr}.dl-row{grid-template-columns:130px 1fr}}

.btn{border:1px solid var(--border-2);background:var(--surface);color:var(--ink);border-radius:6px;
  padding:9px 15px;cursor:pointer;font:inherit;font-weight:600;font-size:13px;transition:all .12s}
.btn:hover{border-color:var(--faint);background:var(--surface-2)}
.btn.p{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.p:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);
  color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:40;
  box-shadow:var(--sh-lift)}
@media (prefers-reduced-motion:no-preference){
  #toast{animation:pop .18s ease}
  .grid,.kpis,.panels,.tablewrap{animation:rise .24s ease both}
  .modal{animation:rise .18s ease both}
}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media(max-width:640px){
  .ribbon{width:100%;margin-left:0;order:3}.subbar .inner{gap:11px}
  /* 150px of label on a 360px screen left the bar itself about 90px wide, so every row looked
     equally full. Stack instead: full-width label, full-width track, value beside it. */
  .brow{grid-template-columns:1fr auto;gap:4px 10px}
  .brow .lab{text-align:left;grid-column:1/-1;white-space:normal}
  .appbar{padding:10px 16px}.wrap{padding:14px 16px 96px}
  .subbar .inner,.filters .inner{padding-left:16px;padding-right:16px}
}

/* ---------- Reports ---------- */

<script>
"use strict";
var TODAY=new Date(); TODAY.setHours(0,0,0,0);
var OWNERS=['Jonathan','Kyle','Cherry','Juan'];
/* Filled from the workbook's own dropdown by onData — a value outside it fails the whole row write. */
var VISITORS=['Juan'];
/*
 * The BOOKING shortlists — who the form offers, as opposed to what the sheet accepts.
 *
 * The client: "for visitior should only juan an cesar only; for assigneg owener should thea, cherry,
 * genesis." The long lists stay behind the filter chips at the top, where you still need to find a lead
 * assigned to somebody who has since left.
 */
var BOOKING_OWNERS=['Thea','Cherry','Genesis'];
var BOOKING_VISITORS=['Juan','Cesar'];
var STAGES=['Visit Scheduled','Visit Completed — Needs Review','Offer Preparation','Offer Sent','Active Negotiation','Verbal Agreement','Contract Sent','Contract Signed','Long-Term Nurture','Lost / Closed Out'];
/*
 * Starting values only — boot() replaces this with DROPDOWNS['Lead Source'] from Config.gs, which is the
 * one true list. It is written out in full anyway so the two cannot silently disagree: this copy was
 * missing 'MLS' long after the workbook had it, so anyone whose boot payload failed to arrive got a
 * booking form that could not file an on-market lead at all.
 */
var LEADS=['Direct Mail','Direct Mail - Postcard','PPC','TV','Facebook','SEO','PPL - Property Leads','PPL - Motivated Leads','MLS'];
/*
 * What the team SEES for a lead source, where that differs from what the sheet STORES.
 *
 * The client, pointing at the booking form: "add in the dashboard of the mls/ redfin right? in adding
 * property tabs". Redfin leads are already handled — REI labels them "MLS/ Redfin" and mapLeadSource folds
 * both into 'MLS' — but a colleague reading a list that says only "MLS" has no way to know that, so a Redfin
 * lead gets filed under Direct Mail or left blank.
 *
 * The label is widened; the stored value is NOT. Adding a second value would split one channel across two
 * rows of every report, break the rows already filed as 'MLS', and create a value REI itself can never
 * produce. The <option> carries value="MLS" and reads "MLS / Redfin", so the sheet is unchanged and the
 * form is finally self-explanatory.
 */
var LEAD_LABELS={'MLS':'MLS / Redfin'};
function leadLabel(s){return LEAD_LABELS[s]||s;}
/*
 * FIVE, not four. The workbook has always accepted 'Skipped — Offer Made' — six rows came over from the old
 * sheet carrying it — but this copy stopped at four and nothing ever corrected it, because Visit Status was
 * not in the payload. It was unreachable from the dashboard, with nothing on screen to hint it existed.
 */
var VSTATUS=['Scheduled','Completed','Canceled','Reschedule Needed','Skipped — Offer Made'];
var NEXT_ACTIONS=['Conduct scheduled visit & log outcome','Decide: make offer or pass','Follow up on sent offer','Re-attempt contact (no reply)','Decide counter response','Prepare & send contract','Confirm signature','Hand off signed contract for transaction coordination','Nurture check-in call','Send requested info to seller'];

var RECS=[];

function dayb(a,b){return Math.round((b-a)/86400000);}
function parse(d){return d?new Date(d+'T00:00:00'):null;}
function compute(r){
  r.daysOverdue=Number(r.daysOverdue)||0;
  if(r.dq==null||r.dq==='')r.dq='OK';
  r.exception=r.exception||''; r.missing=r.missing||'';
  return r;
}
function sev(r){if(r.daysOverdue>0||r.dq==='Exception')return 'crit';if(r.stalled||r.dq==='Incomplete')return 'warn';if(r.stage==='Contract Signed')return 'good';return '';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function money(n){return n?'$'+Number(n).toLocaleString():'';}
function sellerLink(r,txt){var t=esc(txt||r.seller||'(no name)');return r.rei?('<a class="slink" href="'+esc(r.rei)+'" target="_blank" rel="noreferrer">'+t+' <span class="ext">↗</span></a>'):t;}
/* Full 61-column sheet schema, grouped. [shortKey, "Sheet Column Label"] — keys we don't carry in preview data render as "—". */
var SCHEMA=[
 ['Property & lead',[['id','Property ID'],['address','Property Address'],['normAddr','Normalized Address'],['seller','Seller Name'],['phone','Phone'],['email','Email'],['lead','Lead Source'],['rei','REI BlackBook Link']]],
 ['Visit',[['visitDate','Visit Date'],['visitTime','Visit Time'],['visitStatus','Visit Status'],['visitor','Assigned Visitor'],['visitNotes','Visit Notes'],['condition','Property Condition'],['occupancy','Occupancy Status'],['photos','Photos Link'],['video','Video Link'],['file','File Link']]],
 ['Seller details',[['motivation','Seller Motivation'],['timeline','Seller Timeline'],['asking','Asking Price'],['priceExp','Price Expectation'],['concerns','Seller Concerns']]],
 ['Offer',[['offerPromised','Offer Promised Date'],['offer','Approved Offer Amount'],['offerStatus','Offer Status'],['offerPrep','Offer Prepared Date'],['offerSent','Offer Sent Date'],['offerConfirm','Offer Received Confirmation'],['counter','Counteroffer Amount'],['sellerFloor','Seller Floor'],['ourMax','Our Max']]],
 ['Follow-up',[['lastContact','Last Contact Date'],['lastResult','Last Contact Result'],['next','Next Action'],['due','Next Action Due Date'],['owner','Assigned Owner'],['blocker','Blocker'],['daysSince','Days Since Last Activity'],['daysOverdue','Days Overdue'],['stalled','Stalled Status']]],
 ['Gift',[['giftStatus','Gift Status'],['giftReason','Gift Recommendation Reason'],['giftOwner','Gift Approval Owner'],['giftSent','Gift Sent Date'],['giftApprovedBy','Gift Approved By'],['giftApprovalDate','Gift Approval Date']]],
 ['Stage & close',[['stage','Current Stage'],['disposition','Final Disposition'],['closeoutReason','Closeout Reason'],['contractSent','Contract Sent Date'],['contractSigned','Contract Signed Date'],['handoff','Transaction Handoff Status']]],
 ['System / data quality',[['missing','Missing Required Fields'],['dupFlag','Duplicate Address Flag'],['priority','Opportunity Priority'],['created','Created Date'],['lastUpdated','Last Updated Date'],['updatedBy','Updated By'],['source','Source'],['dq','Data Quality Status'],['exceptionReason','Exception Reason'],['reiUpdateReq','REI Update Required'],['reiUpdateDone','REI Update Completed']]]
];
function valOf(r,k){var v=r[k];
  if(k==='stalled')return r.stalled?'Yes':'No';
  if(k==='daysOverdue')return r.daysOverdue>0?r.daysOverdue+' days':'0';
  if(k==='daysSince')return (r.daysSince===''||r.daysSince==null)?'':r.daysSince+' days';
  if(k==='dq')return r.dq||'';
  if(k==='offer'||k==='counter'||k==='asking')return v?money(v):'';
  return (v==null||v==='')?'':String(v);}
var RO_FIELDS=['Property ID','Normalized Address','Days Since Last Activity','Days Overdue','Stalled Status','Missing Required Fields','Duplicate Address Flag','Opportunity Priority','Data Quality Status','Exception Reason','Created Date','Last Updated Date','Updated By'];
var ENUM_FIELDS={'Visit Status':['','Scheduled','Completed','Canceled','Reschedule Needed'],'Current Stage':['','Visit Scheduled','Visit Completed — Needs Review','Offer Preparation','Offer Sent','Active Negotiation','Verbal Agreement','Contract Sent','Contract Signed','Long-Term Nurture','Lost / Closed Out'],'Assigned Owner':['','Jonathan','Kyle','Cherry','Juan'],'Assigned Visitor':['','Juan','Kyle','Cherry','Jonathan','Cesar','Jose Herrera','Manny Morales','Lily','Alan Hernandez'],'Final Disposition':['','Contracted','Lost','Long-Term Nurture','Closed Out'],'Gift Status':['','Not Reviewed','Recommended','Approved','Sent','Not Appropriate'],'Blocker':['','Price','Title','Tenant','Family','Access','Timing','Documents','Seller Unresponsive','Other'],'Transaction Handoff Status':['','Not Ready','Ready for Handoff','Handed Off','Handoff Confirmed'],'Offer Status':['','Not Sent','Sent','Accepted','Countered','Rejected']};
var NUM_FIELDS=['Approved Offer Amount','Counteroffer Amount','Asking Price','Price Expectation','Seller Floor','Our Max'];
function cur_(r,f){return (r.full&&r.full[f[1]]!=null&&r.full[f[1]]!=='')?String(r.full[f[1]]):(valOf(r,f[0])||'');}
function detailField_(r,f,edit){
  var label=f[1], v=cur_(r,f);
  if(!edit||RO_FIELDS.indexOf(label)>=0){
    var link=(f[0]==='rei'&&v)?'<a href="'+esc(v)+'" target="_blank" rel="noreferrer">Open REI ↗</a>':esc(v||'—');
    return '<div class="dl-row'+(v?'':' empty')+'"><dt>'+esc(label)+'</dt><dd>'+link+'</dd></div>';
  }
  var inp;
  if(ENUM_FIELDS[label]){var opts=ENUM_FIELDS[label].slice();if(v&&opts.indexOf(v)<0)opts.push(v);inp='<select data-h="'+esc(label)+'">'+opts.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';}
  else if(label.indexOf('Date')>=0)inp='<input data-h="'+esc(label)+'" type="date" value="'+esc(v)+'">';
  else if(NUM_FIELDS.indexOf(label)>=0)inp='<input data-h="'+esc(label)+'" type="number" value="'+esc(v)+'">';
  else inp='<input data-h="'+esc(label)+'" type="text" value="'+esc(v)+'">';
  return '<div class="dl-row edit"><dt>'+esc(label)+'</dt><dd>'+inp+'</dd></div>';
}
/*
 * Records are addressed by ROW NUMBER, never by Property ID.
 *
 * Property ID is blank on a lot of rows — the imported ones never had it. This filtered on
 * x.id===id, so every card with a blank ID carried data-detail="" and the filter returned the FIRST
 * blank-ID record. Clicking "Full record" on Sara Davenport opened Jose Anguiano.
 *
 * That was the visible half. The same identifier is passed to runAction for Save and Delete, and the
 * server's findRowById_ matched the first blank ID the same way — so Save wrote to the wrong row and
 * Delete trashed the wrong record. rowNum comes straight from the sheet and is always unique.
 */
function openDetail(id,edit){var r=RECS.filter(function(x){return String(x.rowNum)===String(id);})[0];if(!r)return;
  var host=document.createElement('div');host.className='modal-bg';
  var body=SCHEMA.map(function(g){
    var rows=g[1].map(function(f){return detailField_(r,f,edit);}).join('');
    return '<div class="dl-grp"><h4>'+esc(g[0])+'</h4><dl>'+rows+'</dl></div>';}).join('');
  var foot=edit
    ? '<button class="btn" data-x>Cancel</button><button class="btn p" data-save>Save changes</button>'
    : '<button class="btn danger" data-del>🗑 Delete</button><span style="flex:1"></span><button class="btn" data-edit>✏️ Edit</button><button class="btn p" data-x>Close</button>';
  host.innerHTML='<div class="modal detail"><div class="dhead"><div><div class="d-seller">'+sellerLink(r)+'</div><div class="d-addr">'+esc(r.address)+'</div></div><span class="chipstage">'+esc(r.stage)+'</span></div><div class="dbody">'+body+'</div><div class="foot">'+foot+'</div></div>';
  document.body.appendChild(host);function close(){document.body.removeChild(host);}
  host.addEventListener('click',function(e){if(e.target===host)close();});
  host.querySelector('[data-x]').onclick=close;
  if(!edit){
    host.querySelector('[data-edit]').onclick=function(){close();openDetail(id,true);};
    host.querySelector('[data-del]').onclick=function(){if(window.confirm('Move this record to Trash? You can restore it anytime from the 🗑 Trash tab.')){toast('Moving to Trash…');runAction('deleteRecord',id,{},close);}};
  } else {
    host.querySelector('[data-save]').onclick=function(){var params={};host.querySelectorAll('[data-h]').forEach(function(el){params[el.getAttribute('data-h')]=el.value;});toast('Saving…');runAction('updateRecord',id,params,close);};
  }
}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}

var SECTIONS=[
  ['⚠ SLA / Service Failures',function(r){return !!r.sla;}],
  ['🗓 Scheduling Conflicts',function(r){return r.conflict;}],
  ['Contracts Possible This Week',function(r){return ['Verbal Agreement','Contract Sent','Active Negotiation'].indexOf(r.stage)>=0;}],
  /*
   * A cancelled visit leaves this section by itself.
   *
   * The client: "the card should automatic move as well where that should be move, it should be automated
   * right?" Sara Davenport sat here under "Upcoming Visits" for a visit that had been called off, so the
   * section read as three visits coming up when one was off.
   *
   * The move is driven by VISIT STATUS, which REI and the team both set. Current Stage — the thing that
   * decides whether a lead is dead — is still only ever moved by a person, so a lead cannot be quietly
   * written off by a display rule. Same split, and same section name, as attentionBucket_ in ChatNotify.gs,
   * so the board and the 3pm card cannot tell different stories about one lead.
   */
  /*
   * Three sections where there were two, matching attentionBucket_ in ChatNotify.gs exactly.
   *
   * Cherry: "if there was lead is suddenly cancelled but not sure if the lead will go or what, should had a
   * pending tab", and about Jose "this was for follow up, should move to follow up tab."
   *
   * OFF and UNKNOWN need opposite actions. Off means decide — rebook or close out. Unknown means find out, and
   * there is nothing to decide until somebody has spoken to the seller. Follow Up holds the unknowns: called
   * off but still wanted, and a visit whose date has passed while still marked Scheduled. Upcoming Visits is
   * left holding only visits that really are still upcoming.
   */
  /*
   * A visit with NO DATE is not upcoming. The client, on the live board: "UPCOMING VISITS (SCHEDULED) 8" with
   * every one of the eight reading NO DATE — "some is not in the upcoming visit, some of them is dead lead and
   * follow up." A heading saying Scheduled over eight leads with nothing scheduled is untrue, and the count is
   * the part people act on. So a date is now REQUIRED here, and the undated go to Follow Up.
   */
  ['Upcoming Visits (Scheduled)',function(r){
    return r.stage==='Visit Scheduled' && r.visitStatus!=='Canceled' && r.visitStatus!=='Reschedule Needed'
      && !!r.visitDate && r.visitDate >= todayISO();
  }],
  ['Follow Up — Outcome Not Known Yet',function(r){
    return r.visitStatus==='Reschedule Needed'
      || (r.stage==='Visit Scheduled' && r.visitStatus!=='Canceled'
          && (!r.visitDate || r.visitDate < todayISO()));
  }],
  ['Cancelled — Close Out or Rebook',function(r){
    return r.visitStatus==='Canceled';
  }],
  ['Visited — No Offer Decision',function(r){return r.stage==='Visit Completed — Needs Review';}],
  ['Offer Preparation',function(r){return r.stage==='Offer Preparation';}],
  ['Offer Sent — Follow-Up Due',function(r){return r.stage==='Offer Sent';}],
  ['Stalled Deals',function(r){return r.stalled;}],
  ['Overdue Tasks',function(r){return r.daysOverdue>0;}],
  ['Negotiation Decisions',function(r){return r.stage==='Active Negotiation';}],
  ['Contract Handoffs',function(r){return r.stage==='Contract Signed'&&r.handoff!=='Handoff Confirmed';}],
  ['Gift Review',function(r){return r.gift==='Recommended';}],
  ['Long-Term Nurture',function(r){return r.stage==='Long-Term Nurture';}],
  ['Revival Opportunities',function(r){return r.disposition==='Lost'&&r.daysSince!==''&&r.daysSince>=45;}],
  ['Exceptions Requiring Review',function(r){return r.dq==='Incomplete'||r.dq==='Exception';}],
  ['\u2691 Unrouted \u2014 Needs Attention',function(r){
    if(r.stage==='Lost / Closed Out')return false;   // archived by design, not lost
    for(var i=0;i<SECTIONS.length-1;i++){ if(SECTIONS[i][1](r))return false; }
    return true;   // matched nothing above: surface it rather than drop it
  }]
];
var VIEW='board',FILTER='all';
var PSIZE=6,PAGE={};
function keep(r){var own=document.getElementById('owner').value,q=document.getElementById('search').value.trim().toLowerCase();
  if(own&&r.owner!==own)return false; if(q&&(r.seller+' '+r.address).toLowerCase().indexOf(q)<0)return false;
  if(FILTER==='overdue')return r.daysOverdue>0; if(FILTER==='today')return r.due===todayISO(); if(FILTER==='stalled')return r.stalled; if(FILTER==='norei')return !r.rei&&r.stage!=='Lost / Closed Out'; if(FILTER==='sla')return !!r.sla; if(FILTER==='gap')return r.gap>0; if(FILTER==='conflict')return r.conflict; return true;}
function actionsFor(r){var a=[];
  if(r.stage==='Visit Scheduled')a.push(['visitCompleted','Mark visit completed',1]);
  if(r.stage==='Visit Scheduled'||r.stage==='Visit Completed — Needs Review')a.push(['nurture','Move to nurture',0]);
  if(r.stage==='Visit Completed — Needs Review')a.push(['recordOfferSent','Record offer sent',1]);
  if(r.stage==='Offer Sent'){a.push(['logContact','Log follow-up',1]);a.push(['sellerCounter','Seller countered',0]);a.push(['contractSent','Contract sent',0]);}
  if(r.stage==='Active Negotiation'){a.push(['logContact','Log follow-up',1]);a.push(['contractSent','Contract sent',0]);}
  if(r.stage==='Verbal Agreement'||r.stage==='Contract Sent'){a.push(['contractSigned','Contract signed',1]);a.push(['logContact','Log follow-up',0]);}
  a.push(['setNextAction','Set next action',0]); return a;}
var PENDING_PREFIX='PENDING REI LOOKUP';
/*
 * A row a colleague booked from this page whose details are still being fetched from the PC.
 *
 * The client: "it should have a loading and timer, see when its done, just to be accurate." They do NOT
 * need to keep the tab open — the lookup runs on the office PC, not in this browser — but they do need to
 * see that something is happening, and to be told the truth when it stops happening.
 */
function isPending(r){return String(r.address||'').indexOf(PENDING_PREFIX)===0;}
/*
 * When the row was parked, read from the "[since <ISO>]" stamp the server writes into Exception Reason.
 *
 * NOT from Created Date: that column is written by today_(), which is midnight, so subtracting it gave
 * minutes since midnight — the card read "Still not finished 1009m 16s" at ten to five in the afternoon.
 */
function pendingSince(r){
  var m=/\[since ([^\]]+)\]/.exec(String(r.exception||''));
  var d=m?new Date(m[1]):(r.created?new Date(r.created):null);
  return (d&&!isNaN(d.getTime()))?d:null;
}
function waitedFor(r){
  var since=pendingSince(r);
  if(!since)return '';
  var secs=Math.max(0,Math.round((Date.now()-since.getTime())/1000));
  return secs<60?(secs+'s'):(Math.floor(secs/60)+'m '+(secs%60)+'s');
}
/*
 * Fifteen minutes is well past the five-minute timer plus a slow REI page, so at that point it is not
 * slow — something is wrong, and the honest cause is almost always the PC. Saying "still working…"
 * forever is how somebody waits an afternoon for a row that was never going to complete.
 */
function pendingStale(r){
  var since=pendingSince(r);
  if(!since)return false;
  return (Date.now()-since.getTime())>15*60*1000;
}
function cardHTML(r){
  var over=r.daysOverdue>0?' <span class="badge crit">'+r.daysOverdue+'d overdue</span>':'';
  if(isPending(r)){
    var waited=waitedFor(r);
    var stale=pendingStale(r);

 * "Upcoming Visits (Scheduled)" is about what is coming, so overdue-first is the wrong rule there: it buried

 * come first, soonest first — then visits whose date has passed with nothing logged, most recent first.
 * Tomorrow at the top; last week's missed visit below it, still visible.

 * Every other section keeps most-overdue-first, which is right for work that is late.

/*
 * What needs deciding about this visit, or '' when nothing does.

 * The dashboard and the 3pm notification were disagreeing about the same record: the notification said
 * "CANCELED — rebook it or close the lead out" while the card still read "Visit Scheduled" and sat in
 * Upcoming Visits with no sign anything had happened. Cancelling deliberately does NOT move Current
 * Stage — that decision belongs to a person — so the card has to say so instead of moving.
 *
 * Same wording and same precedence as attentionBucket_ in ChatNotify.gs, so the two views cannot tell
 * a different story about one lead.

function visitFlag(r){
  var st=String(r.visitStatus||'').trim();
  if(st==='Canceled') return 'CANCELED';
  if(st==='Reschedule Needed') return 'RESCHEDULE';
  if(!r.visitDate) return 'NO DATE';

function rowsFor(si,live){
  var s=SECTIONS[si];var rows=live.filter(s[1]).filter(keep);

  if(byDate){
    rows.sort(function(a,b){
      // Cancelled, reschedule-needed, overdue and undated all need a decision, so they come first —
      // exactly as they do in the 3pm message.
      var fa=visitFlag(a)?0:1, fb=visitFlag(b)?0:1;
      if(fa!==fb) return fa-fb;
      var x=a.visitDate||'', y=b.visitDate||'';
      // No date at all sorts last: it cannot be placed on a timeline.
      if(!x&&!y) return 0;

      if(xf!==yf) return xf?-1:1;            // anything still to come outranks anything already passed

function hydrate(x){return {rowNum:x.rowNum,id:x.id,created:x.created,seller:x.seller,address:x.address,phone:x.phone,lead:x.lead,stage:x.stage,owner:x.owner,visitStatus:x.visitStatus,next:x.nextAction,due:x.due,daysOverdue:Math.round(Number(x.daysOverdue)||0),stalled:!!x.stalled,blocker:x.blocker,lastResult:x.lastResult,offer:x.offerAmount,dq:x.dq||'OK',missing:x.missing||'',exception:x.exceptionReason||'',rei:x.rei,daysSince:x.daysSince,disposition:x.disposition,gift:x.gift,visitDate:x.visitDate,visitor:x.visitor,visitNotes:x.visitNotes,email:x.email,lastContact:x.lastContact,sla:x.sla||'',offerPromised:x.offerPromised,sellerFloor:x.sellerFloor,ourMax:x.ourMax,gap:Number(x.priceGap)||0,full:x.full};}

/*
 * The booking form does not open until the sheet's own lists have arrived.
 *
 * The client: "the mls getting like this in the tab ann then gogne again what happening?" — MLS was in the
 * dropdown, then it was not. Both were true. Every list on this page is declared twice: a copy written into
 * the file, and the real one that onData brings back from Config.gs a second or two later. Open the form in
 * that gap and you get the file's copy. Which one a colleague saw came down to how fast they clicked after
 * opening the tab, and it looked like the option was disappearing on its own.
 *
 * Syncing the two copies fixes today's symptom and not the fault: the same gap applies to STAGES, VSTATUS,
 * BOOKING_OWNERS and BOOKING_VISITORS, so the next value added to any of them brings the ghost straight
 * back. So the button is inert until real data has landed, once, and openAdd refuses even if something else
 * enables it. A booking made against a stale list is worse than a booking made two seconds later: an
 * out-of-range value fails the WHOLE row write, and the colleague sees "Saved" for a row that never landed.
 *
 * Deliberately NOT reset on later refreshes — the 20-second poll while a row is pending must not blink the
 * button out from under somebody halfway through typing.
 */
var LISTS_READY=false;
function listsReady(){if(LISTS_READY)return;LISTS_READY=true;var b=document.getElementById('add');if(b){b.disabled=false;b.textContent='＋ Book / reschedule visit';}}

  h+='<div class="tablewrap"><table><colgroup><col style="width:13%"><col style="width:20%"><col style="width:27%"><col style="width:15%"><col style="width:13%"><col style="width:12%"></colgroup><thead><tr><th>ID</th><th>Seller</th><th>Address</th><th>Stage</th><th>Deleted</th><th></th></tr></thead><tbody>';
  TRASH.forEach(function(t){h+='<tr><td class="num">'+esc(t.id)+'</td><td><b>'+esc(t.seller||'—')+'</b></td><td class="addr">'+esc(t.address||'—')+'</td><td>'+esc(t.stage||'—')+'</td><td class="num">'+esc(t.deletedDate||'')+'<div class="rsub">'+esc(t.deletedBy||'')+'</div></td><td><button class="btn2 primary" data-restore="'+t.trashRow+'">↩ Restore</button></td></tr>';});

/*
 * If the sheet never answered, the booking button is still inert — say so here rather than leave somebody

function onErr(e){document.getElementById('wrap').innerHTML='<div class="empty">Could not load data: '+esc(e&&e.message||e)

/*
 * Poll ONLY while a row is waiting on the PC, and stop as soon as none are.
 *
 * The board is otherwise event-driven, and a permanent timer on every open tab is load on the Apps Script
 * quota for nothing. This exists for one moment: a colleague has just booked a visit and is watching the
 * card. Twenty seconds is well inside the five-minute job.

  var waiting=RECS.some(isPending);

/*
 * THE THREE STICKY BARS MEASURE THEMSELVES.
 *
 * The app bar, the tab row and the filter row are each stuck to the top, so the second and third have to
 * know how tall the ones above them are. That was written as fixed pixels — top:45px and top:93px — which
 * is right for exactly one window size.
 *
 * Both of the upper bars wrap. The alert ribbon is `flex-wrap:wrap` and below 640px it goes full width on
 * its own line, so the tab row becomes roughly twice its assumed height and the filter row lands on top of
 * it. Add an alert chip, or narrow the window to a laptop half-screen, and the same thing happens without
 * a phone anywhere. It reads as a broken page rather than a layout that needs a number changing.
 *
 * So the heights are read from the rendered elements and written into the two custom properties the CSS
 * offsets are built from. ResizeObserver catches wrapping, font loading, and a ribbon that gains a chip
 * when the data refreshes — none of which fire a resize event.
 */
(function stickyOffsets(){
  var bars=[['.appbar','--h-appbar'],['.subbar','--h-subbar']];
  function apply(){
    bars.forEach(function(b){
      var el=document.querySelector(b[0]);
      if(el) document.documentElement.style.setProperty(b[1], Math.round(el.getBoundingClientRect().height)+'px');
    });
  }
  apply();
  // Fires on wrap and on font swap; the resize listener covers browsers without the observer.
  if(typeof ResizeObserver!=='undefined'){
    var ro=new ResizeObserver(apply);
    bars.forEach(function(b){ var el=document.querySelector(b[0]); if(el) ro.observe(el); });
  }
  window.addEventListener('resize',apply);
  // The ribbon is rebuilt on every data load, so re-measure after one has landed.
  window.addEventListener('load',apply);
})();
